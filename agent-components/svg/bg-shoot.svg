<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Star field with shooting stars">
  <defs>
    <radialGradient id="ac-bgs-sky" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#242360"/>
      <stop offset="52%" stop-color="#181743"/>
      <stop offset="100%" stop-color="#0c0b24"/>
    </radialGradient>
    <radialGradient id="ac-bgs-neb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2D8A7" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#F2D8A7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ac-bgs-tail" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-160" y2="-44">
      <stop offset="0%" stop-color="#F2D8A7" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#F2C78A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F2C78A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ac-bgs-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F2D8A7" stop-opacity="0"/>
    </radialGradient>
    <path id="ac-bgs-star" d="M0 -8 C0.8 -2 2 -0.8 8 0 C2 0.8 0.8 2 0 8 C-0.8 2 -2 0.8 -8 0 C-2 -0.8 -0.8 -2 0 -8 Z"/>
  </defs>
  <style>
    svg{display:block}
    .ac-bgs-w{fill:#ffffff}
    .ac-bgs-g{fill:#F2D8A7}
    .ac-bgs-b{fill:#8FA8D9}
    .ac-bgs-sp{animation:ac-bgs-tw 4s ease-in-out infinite}
    .ac-bgs-dt{animation:ac-bgs-tw 3s ease-in-out infinite}
    @keyframes ac-bgs-tw{0%,100%{opacity:.3}50%{opacity:1}}
    .ac-bgs-shoot1{animation:ac-bgs-fly1 9s linear infinite}
    .ac-bgs-shoot2{animation:ac-bgs-fly2 13s linear infinite;animation-delay:4s}
    @keyframes ac-bgs-fly1{
      0%{transform:translate(-300px,-140px);opacity:0}
      8%{opacity:1}
      52%{opacity:1}
      68%,100%{transform:translate(1520px,330px);opacity:0}
    }
    @keyframes ac-bgs-fly2{
      0%{transform:translate(160px,-180px);opacity:0}
      10%{opacity:1}
      60%{opacity:1}
      76%,100%{transform:translate(1760px,150px);opacity:0}
    }
  </style>
  <rect width="1200" height="600" fill="url(#ac-bgs-sky)"/>
  <ellipse cx="330" cy="180" rx="360" ry="220" fill="url(#ac-bgs-neb)"/>
  <ellipse cx="950" cy="430" rx="300" ry="200" fill="url(#ac-bgs-neb)"/>

  <g transform="translate(118 92)"><use href="#ac-bgs-star" class="ac-bgs-sp ac-bgs-w" style="animation-delay:0s"/></g>
  <g transform="translate(300 178) scale(.8)"><use href="#ac-bgs-star" class="ac-bgs-sp ac-bgs-g" style="animation-delay:.6s"/></g>
  <g transform="translate(486 74) scale(1.1)"><use href="#ac-bgs-star" class="ac-bgs-sp ac-bgs-w" style="animation-delay:1.2s"/></g>
  <g transform="translate(636 208) scale(.7)"><use href="#ac-bgs-star" class="ac-bgs-sp ac-bgs-g" style="animation-delay:.3s"/></g>
  <g transform="translate(824 118) scale(.9)"><use href="#ac-bgs-star" class="ac-bgs-sp ac-bgs-w" style="animation-delay:1.6s"/></g>
  <g transform="translate(998 238)"><use href="#ac-bgs-star" class="ac-bgs-sp ac-bgs-g" style="animation-delay:.9s"/></g>
  <g transform="translate(1122 88) scale(.8)"><use href="#ac-bgs-star" class="ac-bgs-sp ac-bgs-w" style="animation-delay:2.1s"/></g>
  <g transform="translate(196 332) scale(.7)"><use href="#ac-bgs-star" class="ac-bgs-sp ac-bgs-b" style="animation-delay:1.4s"/></g>
  <g transform="translate(418 404) scale(.9)"><use href="#ac-bgs-star" class="ac-bgs-sp ac-bgs-g" style="animation-delay:.2s"/></g>
  <g transform="translate(702 472) scale(.8)"><use href="#ac-bgs-star" class="ac-bgs-sp ac-bgs-w" style="animation-delay:1.8s"/></g>
  <g transform="translate(906 378) scale(.6)"><use href="#ac-bgs-star" class="ac-bgs-sp ac-bgs-g" style="animation-delay:.5s"/></g>
  <g transform="translate(1082 468) scale(.9)"><use href="#ac-bgs-star" class="ac-bgs-sp ac-bgs-w" style="animation-delay:1.1s"/></g>
  <g transform="translate(64 470) scale(.6)"><use href="#ac-bgs-star" class="ac-bgs-sp ac-bgs-g" style="animation-delay:2.4s"/></g>
  <g transform="translate(560 300) scale(.5)"><use href="#ac-bgs-star" class="ac-bgs-sp ac-bgs-w" style="animation-delay:1.9s"/></g>

  <circle class="ac-bgs-dt ac-bgs-w" cx="160" cy="150" r="1.6" style="animation-delay:.4s"/>
  <circle class="ac-bgs-dt ac-bgs-b" cx="260" cy="260" r="1.2" style="animation-delay:.8s"/>
  <circle class="ac-bgs-dt ac-bgs-w" cx="360" cy="110" r="1.6" style="animation-delay:1.3s"/>
  <circle class="ac-bgs-dt ac-bgs-g" cx="520" cy="150" r="1.2" style="animation-delay:.2s"/>
  <circle class="ac-bgs-dt ac-bgs-w" cx="600" cy="60" r="1.5" style="animation-delay:1.7s"/>
  <circle class="ac-bgs-dt ac-bgs-b" cx="700" cy="150" r="1.2" style="animation-delay:.5s"/>
  <circle class="ac-bgs-dt ac-bgs-w" cx="780" cy="260" r="1.6" style="animation-delay:2.2s"/>
  <circle class="ac-bgs-dt ac-bgs-g" cx="880" cy="60" r="1.2" style="animation-delay:.9s"/>
  <circle class="ac-bgs-dt ac-bgs-w" cx="960" cy="160" r="1.5" style="animation-delay:1.1s"/>
  <circle class="ac-bgs-dt ac-bgs-b" cx="1060" cy="320" r="1.2" style="animation-delay:.6s"/>
  <circle class="ac-bgs-dt ac-bgs-w" cx="1120" cy="200" r="1.6" style="animation-delay:1.9s"/>
  <circle class="ac-bgs-dt ac-bgs-g" cx="120" cy="250" r="1.2" style="animation-delay:1.5s"/>
  <circle class="ac-bgs-dt ac-bgs-w" cx="240" cy="470" r="1.5" style="animation-delay:.3s"/>
  <circle class="ac-bgs-dt ac-bgs-b" cx="480" cy="470" r="1.2" style="animation-delay:1s"/>
  <circle class="ac-bgs-dt ac-bgs-w" cx="640" cy="380" r="1.5" style="animation-delay:2s"/>
  <circle class="ac-bgs-dt ac-bgs-g" cx="840" cy="500" r="1.2" style="animation-delay:.7s"/>
  <circle class="ac-bgs-dt ac-bgs-w" cx="1000" cy="520" r="1.5" style="animation-delay:1.4s"/>
  <circle class="ac-bgs-dt ac-bgs-b" cx="60" cy="360" r="1.2" style="animation-delay:2.3s"/>

  <g class="ac-bgs-shoot1">
    <path d="M0 0 L-160 -34 L-160 -6 Z" fill="url(#ac-bgs-tail)"/>
    <path d="M0 0 L-120 -28 L-120 -10 Z" fill="#ffffff" opacity=".45"/>
    <circle r="11" fill="url(#ac-bgs-glow)"/>
    <circle r="3.4" fill="#ffffff"/>
  </g>
  <g class="ac-bgs-shoot2">
    <path d="M0 0 L-120 -26 L-120 -4 Z" fill="url(#ac-bgs-tail)"/>
    <circle r="8" fill="url(#ac-bgs-glow)"/>
    <circle r="2.6" fill="#ffffff"/>
  </g>
</svg>
