<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Quiet star field background">
  <defs>
    <radialGradient id="ac-bgq-sky" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#242360"/>
      <stop offset="52%" stop-color="#181743"/>
      <stop offset="100%" stop-color="#0c0b24"/>
    </radialGradient>
    <radialGradient id="ac-bgq-neb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2D8A7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F2D8A7" stop-opacity="0"/>
    </radialGradient>
    <path id="ac-bgq-star" d="M0 -8 C0.8 -2 2 -0.8 8 0 C2 0.8 0.8 2 0 8 C-0.8 2 -2 0.8 -8 0 C-2 -0.8 -0.8 -2 0 -8 Z"/>
  </defs>
  <style>
    svg{display:block}
    .ac-bgq-w{fill:#ffffff}
    .ac-bgq-g{fill:#F2D8A7}
    .ac-bgq-b{fill:#8FA8D9}
    .ac-bgq-sp{animation:ac-bgq-tw 4s ease-in-out infinite}
    .ac-bgq-dt{animation:ac-bgq-tw 3s ease-in-out infinite}
    @keyframes ac-bgq-tw{0%,100%{opacity:.3}50%{opacity:1}}
  </style>
  <rect width="1200" height="600" fill="url(#ac-bgq-sky)"/>
  <ellipse cx="330" cy="180" rx="360" ry="220" fill="url(#ac-bgq-neb)"/>
  <ellipse cx="950" cy="430" rx="300" ry="200" fill="url(#ac-bgq-neb)"/>

  <g transform="translate(118 92)"><use href="#ac-bgq-star" class="ac-bgq-sp ac-bgq-w" style="animation-delay:0s"/></g>
