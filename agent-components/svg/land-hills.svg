<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Layered hills at dusk">
  <defs>
    <linearGradient id="ac-lh-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15143a"/>
      <stop offset="35%" stop-color="#221a4e"/>
      <stop offset="62%" stop-color="#5a2456"/>
      <stop offset="82%" stop-color="#b53f5c"/>
      <stop offset="100%" stop-color="#E85D5E"/>
    </linearGradient>
    <radialGradient id="ac-lh-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF0CF"/>
      <stop offset="65%" stop-color="#F2D8A7"/>
      <stop offset="100%" stop-color="#F2C78A"/>
    </radialGradient>
    <radialGradient id="ac-lh-sunglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2D8A7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F2D8A7" stop-opacity="0"/>
    </radialGradient>
    <path id="ac-lh-star" d="M0 -7 C0.7 -1.8 1.8 -0.7 7 0 C1.8 0.7 0.7 1.8 0 7 C-0.7 1.8 -1.8 0.7 -7 0 C-1.8 -0.7 -0.7 -1.8 0 -7 Z"/>
  </defs>
  <style>
    svg{display:block}
    .ac-lh-tw{animation:ac-lh-tw 4s ease-in-out infinite}
    @keyframes ac-lh-tw{0%,100%{opacity:.35}50%{opacity:1}}
  </style>

  <rect width="1200" height="400" fill="url(#ac-lh-sky)"/>

  <g transform="translate(140 70) scale(.8)"><use href="#ac-lh-star" class="ac-lh-tw" fill="#ffffff" style="animation-delay:0s"/></g>
  <g transform="translate(320 130) scale(.6)"><use href="#ac-lh-star" class="ac-lh-tw" fill="#F2D8A7" style="animation-delay:.8s"/></g>
  <g transform="translate(520 60) scale(.7)"><use href="#ac-lh-star" class="ac-lh-tw" fill="#ffffff" style="animation-delay:1.5s"/></g>
  <g transform="translate(700 120) scale(.5)"><use href="#ac-lh-star" class="ac-lh-tw" fill="#8FA8D9" style="animation-delay:2.1s"/></g>
  <g transform="translate(980 70) scale(.65)"><use href="#ac-lh-star" class="ac-lh-tw" fill="#ffffff" style="animation-delay:1.1s"/></g>
  <g transform="translate(1120 150) scale(.55)"><use href="#ac-lh-star" class="ac-lh-tw" fill="#F2D8A7" style="animation-delay:2.6s"/></g>
  <g transform="translate(240 210) scale(.45)"><use href="#ac-lh-star" class="ac-lh-tw" fill="#ffffff" style="animation-delay:.4s"/></g>
  <g transform="translate(860 200) scale(.45)"><use href="#ac-lh-star" class="ac-lh-tw" fill="#8FA8D9" style="animation-delay:1.9s"/></g>

  <circle cx="880" cy="252" r="130" fill="url(#ac-lh-sunglow)"/>
  <circle cx="880" cy="252" r="74" fill="url(#ac-lh-sun)"/>

  <path d="M0 268 C140 232 260 246 380 258 C520 272 600 238 740 244 C880 250 980 276 1100 262 C1150 256 1180 250 1200 248 L1200 400 L0 400 Z" fill="#2b1c4d"/>
  <path d="M0 300 C120 276 240 286 360 298 C500 312 620 282 760 288 C900 294 1000 318 1120 308 L1200 304 L1200 400 L0 400 Z" fill="#43205e"/>
  <path d="M0 336 C180 316 300 330 440 342 C580 354 700 330 840 336 C980 342 1080 356 1200 348 L1200 400 L0 400 Z" fill="#7a2a63"/>
  <path d="M0 370 C200 356 340 366 500 374 C660 382 800 366 960 372 C1080 376 1160 372 1200 370 L1200 400 L0 400 Z" fill="#E85D5E"/>
</svg>
