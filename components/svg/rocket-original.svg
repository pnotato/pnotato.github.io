<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Original pink portfolio rocket">
  <defs>
    <linearGradient id="ac-ro-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#c44569"/>
    </linearGradient>
    <linearGradient id="ac-ro-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d65780"/>
      <stop offset="100%" stop-color="#a83d5e"/>
    </linearGradient>
    <linearGradient id="ac-ro-window" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8c8e4"/>
      <stop offset="100%" stop-color="#6b8fb8"/>
    </linearGradient>
    <linearGradient id="ac-ro-flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2D8A7"/>
      <stop offset="52%" stop-color="#E85D5E"/>
      <stop offset="100%" stop-color="#C62368"/>
    </linearGradient>
  </defs>
  <style>
    svg{display:block}
    .ac-ro-rocket{animation:ac-ro-float 4s ease-in-out infinite}
    .ac-ro-flame{transform-origin:200px 322px;animation:ac-ro-flicker .24s ease-in-out infinite alternate}
    @keyframes ac-ro-float{0%,100%{transform:translateY(4px)}50%{transform:translateY(-5px)}}
    @keyframes ac-ro-flicker{from{transform:scaleY(1);opacity:1}to{transform:scaleY(.82);opacity:.8}}
    @media(prefers-reduced-motion:reduce){.ac-ro-rocket,.ac-ro-flame{animation:none}}
  </style>
  <g class="ac-ro-rocket">
    <path d="M140 205 C110 213 92 242 88 284 L142 274 Z" fill="url(#ac-ro-wing)"/>
    <path d="M260 205 C290 213 308 242 312 284 L258 274 Z" fill="url(#ac-ro-wing)"/>
    <rect x="140" y="74" width="120" height="190" rx="26" fill="url(#ac-ro-body)"/>
    <circle cx="200" cy="70" r="32" fill="#ff8db2"/>
    <circle cx="200" cy="122" r="25" fill="url(#ac-ro-window)"/>
    <circle cx="191" cy="113" r="9" fill="#fff" opacity=".64"/>
    <rect x="140" y="157" width="120" height="16" fill="#ffb3c9" opacity=".82"/>
    <path d="M174 248 H226 V280 Q226 288 218 288 H182 Q174 288 174 280Z" fill="#5a3d4f"/>
    <path d="M166 280 H234 V310 Q234 320 224 320 H176 Q166 320 166 310Z" fill="#3a2a3a"/>
    <g class="ac-ro-flame">
      <path d="M180 318 C164 345 175 369 190 383 C196 358 200 340 200 318Z" fill="url(#ac-ro-flame)"/>
      <path d="M220 318 C236 345 225 369 210 383 C204 358 200 340 200 318Z" fill="url(#ac-ro-flame)"/>
    </g>
  </g>
</svg>
